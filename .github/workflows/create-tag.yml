name: Create Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag à créer (ex: 2.8.0 ou v2.8.0)'
        required: true
        type: string
      branch:
        description: 'Branche sur laquelle poser le tag'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  create-tag:
    name: Create, Push Tag and Trigger Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Format tag and create git tag
        id: tag_step
        run: |
          RAW_TAG="${{ inputs.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            echo "Erreur : Le nom du tag ne peut pas être vide."
            exit 1
          fi

          # Extraire le numéro de version propre et formater le tag Git en 'vX.Y.Z'
          CLEAN_VERSION=$(echo "$RAW_TAG" | sed 's/^[^0-9]*//')
          TAG="v${CLEAN_VERSION}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Création du tag Git $TAG sur la branche ${{ inputs.branch }} (commit $(git rev-parse --short HEAD))..."
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Trigger Release Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_step.outputs.tag }}"
          echo "Déclenchement du workflow Release pour $TAG..."
          gh workflow run release.yml -f tag_name="$TAG"
