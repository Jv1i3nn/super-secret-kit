name: Create Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag à créer (format X.Y.Z, ex: 2.8.0)'
        required: true
        type: string
      branch:
        description: 'Branche sur laquelle poser le tag'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  create-tag:
    name: Create, Push Tag and Trigger Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Validate and create git tag
        id: tag_step
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Erreur : tag invalide '$TAG' (attendu X.Y.Z, sans 'v')."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Création du tag Git $TAG sur la branche ${{ inputs.branch }} (commit $(git rev-parse --short HEAD))..."
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Trigger Release Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_step.outputs.tag }}"
          echo "Déclenchement du workflow Release pour $TAG..."
          gh workflow run release.yml -f tag_name="$TAG"
